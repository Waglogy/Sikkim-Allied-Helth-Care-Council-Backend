name: Deploy Backend

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # Build (and validate) the executable jar on a native x86 runner. JVM
  # bytecode is portable, so we do NOT need to compile under ARM emulation.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build executable jar
        run: |
          chmod +x ./gradlew
          ./gradlew clean bootJar -x test
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/app.jar

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: build/libs

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Only the arm64 JRE base differs per-arch; the copied jar is identical,
      # so this is a fast package step, not an emulated build.
      - name: Build ARM64 image and export
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --tag sahc-backend:latest \
            --output type=docker,dest=sahc-backend.tar \
            .

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Transfer image to server
        run: scp sahc-backend.tar ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/sahc-backend.tar

      - name: Write .env file on server
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} 'mkdir -p ~/sahc'
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "cat > ~/sahc/.env" << ENVFILE
          DB_URL=${{ secrets.DB_URL }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}
          R2_ENDPOINT=${{ secrets.R2_ENDPOINT }}
          R2_BUCKET=${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BASE_URL=${{ secrets.R2_PUBLIC_BASE_URL }}
          ENVFILE

      - name: Deploy on server
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            set -e
            docker load -i /tmp/sahc-backend.tar
            docker stop sahc-backend 2>/dev/null || true
            docker rm sahc-backend 2>/dev/null || true
            docker run -d \
              --name sahc-backend \
              --network waglogy-net \
              --restart unless-stopped \
              --env-file "$HOME/sahc/.env" \
              -p 8085:8080 \
              sahc-backend:latest
            rm -f /tmp/sahc-backend.tar
          EOF
